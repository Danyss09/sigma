# Construye las 3 imagenes de SIGMA (backend, web, ml). Al activar el push en la rama "servidor" las publica
# en GHCR y, si defines la variable de repositorio DESPLEGAR=true, actualiza el servidor por SSH.
# En pull requests solo construye (no publica) para comprobar que todo compila.
name: Imagenes y despliegue

on:
  # Publicacion automatica al hacer push: DESACTIVADA hasta que el servidor este listo.
  # Para activarla, quita los "#" de las dos lineas siguientes.
  # push:
  #   branches: [servidor]
  pull_request:
    branches: [servidor, main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  imagenes:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - nombre: backend
            contexto: ./backend
            archivo: ./backend/Dockerfile
          - nombre: web
            contexto: ./frontend
            archivo: ./frontend/Dockerfile.prod
          - nombre: ml
            contexto: ./ml
            archivo: ./ml/Dockerfile
    steps:
      - uses: actions/checkout@v4

      # GHCR exige el nombre del propietario en minusculas
      - name: Propietario en minusculas
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Iniciar sesion en GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir (y publicar si no es pull request)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.contexto }}
          file: ${{ matrix.archivo }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ env.OWNER }}/sigma-${{ matrix.nombre }}:latest
            ghcr.io/${{ env.OWNER }}/sigma-${{ matrix.nombre }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  desplegar:
    needs: imagenes
    # Solo en la rama servidor y solo si defines la variable DESPLEGAR=true (Settings > Variables)
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/servidor' && vars.DESPLEGAR == 'true'
    runs-on: ubuntu-latest
    steps:
      # Secrets necesarios (Settings > Secrets and variables > Actions): SSH_HOST, SSH_USER, SSH_KEY
      - name: Actualizar el servidor
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          script: |
            cd /opt/sigma
            git pull --ff-only
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
